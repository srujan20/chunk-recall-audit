<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 744" width="1000" height="744" role="img" aria-label="What the chunker decides before retrieval, what the retriever decides after, and which failures belong to which">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa2aa" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="744" fill="#ffffff" />
  <text x="40" y="32" fill="#14171a" font-size="15" font-weight="650" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>chunkaudit: the bound is decided above the line, and every retriever lives below it</tspan>
  </text>
  <rect x="40" y="64" width="440" height="100" rx="6" fill="#f2f4f6" stroke="#8f9aa4" stroke-width="1.2" />
  <text x="54" y="89" fill="#14171a" font-size="13.5" font-weight="650" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>The corpus: documents and answer spans</tspan>
  </text>
  <text x="54" y="110" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>an answer is a half open character interval</tspan>
  </text>
  <text x="54" y="129" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>into one named document, so containment is</tspan>
  </text>
  <text x="54" y="148" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>an interval question with an exact answer</tspan>
  </text>
  <rect x="520" y="64" width="440" height="100" rx="6" fill="#f2f4f6" stroke="#8f9aa4" stroke-width="1.2" />
  <text x="534" y="89" fill="#14171a" font-size="13.5" font-weight="650" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>The chunking: size, stride, strategy</tspan>
  </text>
  <text x="534" y="110" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>four strategies, one of them a reimplemented</tspan>
  </text>
  <text x="534" y="129" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>recursive splitter, so the behaviour measured</tspan>
  </text>
  <text x="534" y="148" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>is written down here rather than imported</tspan>
  </text>
  <line x1="260" y1="166" x2="260" y2="208" stroke="#9aa2aa" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="740" y1="166" x2="740" y2="208" stroke="#9aa2aa" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="40" y="212" width="920" height="108" rx="6" fill="#eef4ea" stroke="#b3cba4" stroke-width="1.2" />
  <text x="54" y="237" fill="#14171a" font-size="13.5" font-weight="650" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>The containment ceiling, computed with no model at all</tspan>
  </text>
  <text x="54" y="258" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>Does any chunk hold this answer whole? Interval arithmetic, exact, and cheap enough that the whole sweep</tspan>
  </text>
  <text x="54" y="277" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>finishes in seconds. The aggregate is the highest span complete recall any retriever can reach, and an</tspan>
  </text>
  <text x="54" y="296" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>oracle attains it, so the bound is tight rather than merely an upper one.</tspan>
  </text>
  <line x1="24" y1="344" x2="976" y2="344" stroke="#6d1717" stroke-width="1.4" stroke-dasharray="7 5" />
  <text x="28" y="338" fill="#6d1717" font-size="11" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>free, exact, bounds everything below</tspan>
  </text>
  <text x="972" y="338" fill="#6d1717" font-size="11" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="end">
    <tspan>needs an index, and cannot exceed the line</tspan>
  </text>
  <line x1="151" y1="344" x2="151" y2="362" stroke="#9aa2aa" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="40" y="366" width="222" height="96" rx="6" fill="#ffffff" stroke="#8f9aa4" stroke-width="1.2" />
  <text x="54" y="391" fill="#14171a" font-size="13.5" font-weight="650" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>bm25</tspan>
  </text>
  <text x="54" y="412" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>Okapi, written out</tspan>
  </text>
  <text x="54" y="431" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>the parameters are</tspan>
  </text>
  <text x="54" y="450" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>part of the finding</tspan>
  </text>
  <line x1="151" y1="464" x2="151" y2="492" stroke="#9aa2aa" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="389" y1="344" x2="389" y2="362" stroke="#9aa2aa" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="278" y="366" width="222" height="96" rx="6" fill="#ffffff" stroke="#8f9aa4" stroke-width="1.2" />
  <text x="292" y="391" fill="#14171a" font-size="13.5" font-weight="650" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>hashed vectors</tspan>
  </text>
  <text x="292" y="412" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>character n grams with</tspan>
  </text>
  <text x="292" y="431" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>idf weighting. A lexical</tspan>
  </text>
  <text x="292" y="450" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>method, not a neural one</tspan>
  </text>
  <line x1="389" y1="464" x2="389" y2="492" stroke="#9aa2aa" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="627" y1="344" x2="627" y2="362" stroke="#9aa2aa" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="516" y="366" width="222" height="96" rx="6" fill="#ffffff" stroke="#8f9aa4" stroke-width="1.2" />
  <text x="530" y="391" fill="#14171a" font-size="13.5" font-weight="650" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>oracle</tspan>
  </text>
  <text x="530" y="412" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>sees the answer</tspan>
  </text>
  <text x="530" y="431" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>an upper bound</tspan>
  </text>
  <text x="530" y="450" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>attains the ceiling</tspan>
  </text>
  <line x1="627" y1="464" x2="627" y2="492" stroke="#9aa2aa" stroke-width="1.2" marker-end="url(#arrow)" />
  <line x1="857" y1="344" x2="857" y2="362" stroke="#9aa2aa" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="754" y="366" width="206" height="96" rx="6" fill="#fdf0d8" stroke="#e5c583" stroke-width="1.2" />
  <text x="768" y="391" fill="#14171a" font-size="13.5" font-weight="650" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>sentence transformer</tspan>
  </text>
  <text x="768" y="412" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>written, never run</tspan>
  </text>
  <text x="768" y="431" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>the weights host was</tspan>
  </text>
  <text x="768" y="450" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>unreachable. ADR-003</tspan>
  </text>
  <line x1="857" y1="464" x2="857" y2="492" stroke="#9aa2aa" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="40" y="496" width="920" height="84" rx="6" fill="#e8eef5" stroke="#a9bed4" stroke-width="1.2" />
  <text x="54" y="521" fill="#14171a" font-size="13.5" font-weight="650" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>Every failure, attributed to exactly one cause</tspan>
  </text>
  <text x="54" y="542" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>no chunk holds it whole, which no retriever change reaches  |  a chunk holds it and was not retrieved,</tspan>
  </text>
  <text x="54" y="561" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>which is the only one an encoder upgrade touches  |  it is not in the corpus at all</tspan>
  </text>
  <line x1="500" y1="582" x2="500" y2="604" stroke="#9aa2aa" stroke-width="1.2" marker-end="url(#arrow)" />
  <rect x="250" y="608" width="500" height="96" rx="6" fill="#f2f4f6" stroke="#8f9aa4" stroke-width="1.2" />
  <text x="264" y="633" fill="#14171a" font-size="13.5" font-weight="650" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>Verdict, and the exit code that carries it</tspan>
  </text>
  <text x="264" y="654" fill="#5b636b" font-size="11.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">
    <tspan>0  the answers survive this chunking</tspan>
  </text>
  <text x="264" y="671" fill="#5b636b" font-size="11.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">
    <tspan>1  the chunker destroys material answers</tspan>
  </text>
  <text x="264" y="688" fill="#5b636b" font-size="11.5" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">
    <tspan>2  the causes cannot be told apart</tspan>
  </text>
  <text x="40" y="734" fill="#5b636b" font-size="11.5" font-weight="400" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start">
    <tspan>The amber box is a retriever this build could not run. The green box bounds it anyway, which is the point.</tspan>
  </text>
</svg>
